_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "One flight request, a nonprofit's real travel policy: book it, refuse it, or hold it for sign-off"
summary: "An agent handles one traveller's flight request under the DNDi Travel and Reimbursement Policy (version 3.0, 2022), read verbatim. It reads the trip record, searches a simulated flight world (real airports and airlines, synthetic schedules and fares) and submits a decision with the offer, cabin, reason, approver and policy section. A deterministic verifier rebuilds the offers and the policy's answer itself and checks every field. Twenty-four cases cover the four-hour routing margin to the minute, nine-hour and six-hour cabin lines on both sides, overnight and partner-meeting conditions, the five-traveller routing rule, the EUR 5,000 ticket sign-off, trains, personal days, commuting, and the policy's own unclear words."
highlights:
  - "The verbatim policy: no paraphrase, no rules restated in the task"
  - "Exact boundaries: 239 against 240 minutes longer, 540 against 535 and 361 against 360 scheduled minutes, EUR 5,000.00 against 5,010.00"
  - "Unclear clauses become holds for approval, each once, with clear twins on both sides"
  - "Fully offline: a hash-seeded flight world with unguessable offer ids"
steps:
  - "Name a case, for example cobalt-finch, with the traveller's request"
  - "The agent reads the trip record and searches flights on the trip's route and date"
  - "It submits BOOK, REFUSE or FLAG_FOR_APPROVAL with the offer, cabin, reason, approver and section"
  - "The verifier recomputes the policy's answer and checks every field"
